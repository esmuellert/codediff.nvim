name: Build library (Windows)

# Native Windows build using MSVC. MSVC has built-in OpenMP; nmake drives the
# CMake-generated Makefile.win.
#
# Inputs:
#   arch     - "x64" or "arm64"
#   runs-on  - GitHub runner label (windows-latest or windows-11-arm)
#   artifact - Name of the uploaded artifact (e.g. "windows-x64")
#   version  - Optional release version applied before building

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      artifact:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.artifact }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply release version
        if: inputs.version != ''
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: Set-Content -Path VERSION -Value $env:BUILD_VERSION

      - name: Setup Neovim
        uses: ./.github/actions/setup-neovim
        with:
          arch: ${{ inputs.arch }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build library
        run: nmake /f Makefile.win build

      - name: Run C unit tests
        run: nmake /f Makefile.win test-c

      - name: Run Neovim tests
        shell: bash
        env:
          # E2E specs create up to 120 isolated Git/Neovim instances. Avoid
          # oversubscribing process startup and give the whole spec a budget;
          # individual async assertions retain their bounded timeouts.
          CODEDIFF_TEST_JOBS: '4'
          CODEDIFF_TEST_TIMEOUT: '900000'
        run: ./tests/run_tests.sh

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: libvscode_diff.dll
          if-no-files-found: ignore
          retention-days: 7
